<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Padette</title>
  <meta name="theme-color" content="#1a1916">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Padette">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="pad" aria-label="Controller"></main>
    <header class="topbar">
      <button class="badge" id="player" hidden>Player 1</button>
      <div class="status" id="status" aria-live="polite">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
      <span class="topbar-end" id="topbar-end">
        <button class="icon-btn" id="edit-btn" aria-label="Move buttons">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg>
        </button>
      </span>
    </header>
    <p class="debug" id="debug" hidden></p>
    <div class="edit-bar" id="edit-bar" hidden>
      <p>Drag to move. Drag the corner to resize.</p>
      <div class="edit-toggles" id="edit-toggles"></div>
      <div class="edit-actions">
        <button class="text-btn" type="button" id="edit-reset">Reset</button>
        <button class="text-btn" type="button" id="edit-cancel">Cancel</button>
        <button class="primary-btn" type="button" id="edit-done">Done</button>
      </div>
    </div>
    <div class="overlay" id="overlay" hidden><p id="overlay-text"></p></div>
    <div class="rotate"><p>Turn your phone sideways</p></div>
  </div>

  <div class="sheet" id="pin-sheet" hidden>
    <form class="sheet-card" id="pin-form" role="dialog" aria-modal="true" aria-labelledby="pin-title">
      <h2 id="pin-title">Enter PIN</h2>
      <p class="muted">The 6-digit PIN is shown in the Padette window on the PC.</p>
      <input id="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="••••••" aria-label="PIN">
      <p class="error" id="pin-error" hidden></p>
      <button class="primary-btn wide" type="submit">Connect</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="toast-btn" id="toast-btn" hidden></button>
  </div>

  <script src="vendor/nacl-fast.min.js"></script>
  <script src="net.js"></script>
  <script src="layout.js"></script>
  <script src="pad.js"></script>
  <script src="editor.js"></script>
</body>
</html>
